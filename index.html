
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17324d">
 <link rel="manifest" href="manifest.webmanifest">
<title>Peters Adressbuch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f7;color:#182431;font:16px system-ui,sans-serif}
header{background:#17324d;color:white;padding:20px}
h1{margin:0;font-size:25px}
main{max-width:750px;margin:auto;padding:14px}
input,textarea,button{font:inherit;padding:12px;border-radius:9px}
input,textarea{width:100%;border:1px solid #ccd5df;margin:5px 0 10px;background:white}
button{border:0;background:#245d86;color:white;font-weight:600;cursor:pointer;margin:3px}
.secondary{background:#e0e8ef;color:#17324d}
.card{background:white;border:1px solid #dce3e9;border-radius:13px;padding:14px;margin:10px 0}
.name{font-size:19px;font-weight:bold}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.actions button{flex:1}
small{color:#667581}
#editor{display:none;background:white;border:1px solid #ccd5df;border-radius:13px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
</style>
</head>
<body>
<header>
<h1>📇 Peters Adressbuch</h1>
<small style="color:#d9e7f1">Deine Kontakte. Einfach. Privat.</small>
</header>
<main>
<input id="search" placeholder="🔎 Kontakte suchen …">
<div class="row">
<button onclick="newContact()">＋ Kontakt</button>
<button onclick="backup()">Backup speichern</button>
</div>
<div class="row">
<button class="secondary" onclick="document.getElementById('file').click()">Backup / VCF importieren</button>
<input id="file" type="file" accept=".json,.vcf,.vcard,.csv" hidden onchange="importFile(event)">
</div>

<section id="editor">
<h2 id="formTitle">Neuer Kontakt</h2>
<input id="id" type="hidden">
<label>Name *</label><input id="name" placeholder="Vor- und Nachname">
 
<label>Kontaktfoto</label>
<input id="photoFile" type="file" accept="image/*">
<img id="photoPreview" alt="Kontaktfoto" style="display:none;width:90px;height:90px;object-fit:cover;border-radius:50%;margin:8px 0">
<button type="button" class="secondary" onclick="removePhoto()">Foto entfernen</button>

<label>Firma</label><input id="company" placeholder="Firma">
<label>Telefon</label><input id="phone" type="tel" placeholder="+49 …">
<label>E-Mail</label><input id="email" type="email" placeholder="E-Mail-Adresse">
<label>Straße und Hausnummer</label><input id="street" placeholder="Straße und Hausnummer">
<div class="row">
<input id="postcode" placeholder="PLZ">
<input id="city" placeholder="Ort">
</div>
<label>Notizen</label><textarea id="notes" rows="3" placeholder="Notizen"></textarea>
<button onclick="saveContact()">Speichern</button>
<button class="secondary" onclick="closeEditor()">Abbrechen</button>
</section>

<p id="count"><small>Kontakte werden lokal gespeichert.</small></p>
<section id="contacts"></section>
<p><small>Die Kontakte bleiben in diesem Browser auf deinem Gerät. Bitte regelmäßig ein Backup erstellen.</small></p>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const fields=["name","company","phone","email","street","postcode","city","notes"];
let contacts=[];
 
let currentPhoto = "";

$("photoFile").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Bitte eine Bilddatei auswählen.");
    this.value = "";
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    alert("Bitte ein Foto mit maximal 3 MB auswählen.");
    this.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {
    currentPhoto = reader.result;
    $("photoPreview").src = currentPhoto;
    $("photoPreview").style.display = "block";
  };

  reader.readAsDataURL(file);
});

function removePhoto() {
  currentPhoto = "";
  $("photoFile").value = "";
  $("photoPreview").removeAttribute("src");
  $("photoPreview").style.display = "none";
}

try{contacts=JSON.parse(localStorage.getItem("petersKontakte")||"[]")}
catch(e){contacts=[]}

function persist(){
 try{localStorage.setItem("petersKontakte",JSON.stringify(contacts))}
 catch(e){alert("Speichern nicht möglich. Bitte Browser-Speicher prüfen und ein Backup erstellen.")}
}
function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function render(){
 const q=$("search").value.trim().toLocaleLowerCase("de");
 const list=contacts.filter(c=>fields.some(k=>
 String(c[k]||"").toLocaleLowerCase("de").includes(q)
 )).sort((a,b)=>a.name.localeCompare(b.name,"de"));
 $("count").textContent=list.length+" Kontakte";
 $("contacts").innerHTML=list.map(c=>{
 const address=[c.street,[c.postcode,c.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
 return `<article class="card">
 <div class="name">${esc(c.name)}</div>
 ${c.company?`<div>${esc(c.company)}</div>`:""}
 ${c.phone?`<p>☎ ${esc(c.phone)}</p>`:""}
 ${c.email?`<p>✉ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>`:""}
 ${address?`<p>📍 ${esc(address)}</p>`:""}
 ${c.notes?`<p>${esc(c.notes)}</p>`:""}
 <div class="actions">
 ${c.phone?`<button onclick="callContact('${c.id}')">Anrufen</button>
 <button onclick="whatsapp('${c.id}')">WhatsApp</button>`:""}
 <button class="secondary" onclick="editContact('${c.id}')">Bearbeiten</button>
 <button class="secondary" onclick="deleteContact('${c.id}')">Löschen</button>
 ${address?`<button class="secondary" onclick="maps('${c.id}')">Karte</button>`:""}
 </div></article>`;
 }).join("")||"<div class='card'>Keine Kontakte gefunden. Lege deinen ersten Kontakt an.</div>";
}
function newContact(){
 $("formTitle").textContent="Neuer Kontakt";
 $("id").value="";
 currentPhoto = "";
$("photoFile").value = "";
$("photoPreview").style.display = "none";
$("photoPreview").removeAttribute("src");
 fields.forEach(k=>$(k).value="");
 currentPhoto = c.photo || "";
$("photoFile").value = "";

if (currentPhoto) {
  $("photoPreview").src = currentPhoto;
  $("photoPreview").style.display = "block";
} else {
  $("photoPreview").removeAttribute("src");
  $("photoPreview").style.display = "none";
}
 $("editor").style.display="block";
 $("name").focus();
}
function editContact(id){
 const c=contacts.find(x=>x.id===id);if(!c)return;
 $("formTitle").textContent="Kontakt bearbeiten";
 $("id").value=c.id;
 fields.forEach(k=>$(k).value=c[k]||"");
 $("editor").style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}
function closeEditor(){$("editor").style.display="none"}
function saveContact(){
 const c={id:$("id").value||String(Date.now())};
 fields.forEach(k=>c[k]=$(k).value.trim());
 c.photo = currentPhoto;
 if(!c.name){alert("Bitte einen Namen eingeben.");return}
 const i=contacts.findIndex(x=>x.id===c.id);
 if(i>=0)contacts[i]=c;else contacts.push(c);
 persist();closeEditor();render();
}
function deleteContact(id){
 const c=contacts.find(x=>x.id===id);
 if(c&&confirm("Kontakt "+c.name+" wirklich löschen?")){
 contacts=contacts.filter(x=>x.id!==id);persist();render();
 }
}
function callContact(id){
 const c=contacts.find(x=>x.id===id);if(!c)return;
 if(confirm("Telefonwähler für "+c.name+" ("+c.phone+") öffnen?")){
 location.href="tel:"+c.phone;
 }
}
function whatsapp(id){
 const c=contacts.find(x=>x.id===id);if(!c)return;
 if(!confirm("WhatsApp für "+c.name+" öffnen?"))return;
 let n=c.phone.replace(/[^\d+]/g,"");
 if(n.startsWith("+"))n=n.slice(1);
 else if(n.startsWith("00"))n=n.slice(2);
 else if(n.startsWith("0")){
  alert("Bitte die Nummer international speichern, z. B. +49 statt 0 am Anfang.");
  return;
 }
 n=n.replace(/\D/g,"");
 if(n)window.open("https://wa.me/"+n,"_blank","noopener");
}
function maps(id){
 const c=contacts.find(x=>x.id===id);if(!c)return;
 const a=[c.street,c.postcode,c.city].filter(Boolean).join(", ");
 window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a),"_blank","noopener");
}
function backup(){
 const blob=new Blob([JSON.stringify({format:"PetersAdressbuch",contacts},null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="peters-adressbuch-backup.json";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importFile(event){
 const f=event.target.files[0];if(!f)return;
 try{
  const txt=await f.text();let incoming=[];
  if(/\.json$/i.test(f.name)){
   const data=JSON.parse(txt);
   incoming=data.contacts;
   if(!Array.isArray(incoming))throw Error("Ungültige Backup-Datei");
  }else if(/\.vcf$|\.vcard$/i.test(f.name)||txt.includes("BEGIN:VCARD")){
   const unfolded=txt.replace(/\r?\n[ \t]/g,"");
   incoming=unfolded.split(/BEGIN:VCARD/i).slice(1).map(block=>{
    const c={};block.split(/END:VCARD/i)[0].split(/\r?\n/).forEach(line=>{
     const i=line.indexOf(":");if(i<0)return;
     const k=line.slice(0,i).split(";")[0].toUpperCase();
     const v=line.slice(i+1).replace(/\\n/gi," ").replace(/\\,/g,",");
     if(k==="FN")c.name=v;
     if(k==="ORG")c.company=v;
     if(k==="TEL"&&!c.phone)c.phone=v;
     if(k==="EMAIL"&&!c.email)c.email=v;
     if(k==="NOTE")c.notes=v;
     if(k==="ADR"){const p=v.split(";");c.street=p[2]||"";c.city=p[3]||"";c.postcode=p[5]||""}
    });
    c.id=String(Date.now()+Math.random());return c;
   });
  }else{
   throw Error("Bitte ein JSON-Backup oder eine VCF-Datei wählen.");
  }
  if(!confirm(incoming.length+" Kontakte gefunden. Importieren?"))return;
  const known=new Set(contacts.map(c=>(c.phone||"").replace(/\D/g,"")).filter(Boolean));
  let added=0;
  incoming.forEach(raw=>{
   const c={id:String(Date.now()+Math.random())};
   fields.forEach(k=>c[k]=String(raw[k]||""));
   const p=c.phone.replace(/\D/g,"");
   if(p&&known.has(p))return;
   if(!c.name)c.name="Importierter Kontakt";
   contacts.push(c);if(p)known.add(p);added++;
  });
  persist();render();alert(added+" Kontakte importiert.");
 }catch(e){alert("Import fehlgeschlagen: "+e.message)}
 finally{event.target.value=""}
}
$("search").addEventListener("input",render);
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.error("Offline-Modus:", error));
  });
}
</script>
</body>
</html>
