<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.webmanifest">
<title>Peters Adressbuch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f7;color:#182431;font:16px system-ui,sans-serif}
header{background:#17324d;color:white;padding:20px}
h1{margin:0;font-size:25px}
main{max-width:750px;margin:auto;padding:14px}
input,textarea,button{font:inherit;padding:12px;border-radius:9px}
input,textarea{width:100%;border:1px solid #ccd5df;margin:5px 0 10px;background:white}
button{border:0;background:#245d86;color:white;font-weight:600;cursor:pointer;margin:3px}
button.secondary{background:#e0e8ef;color:#17324d}
.card{background:white;border:1px solid #dce3e9;border-radius:13px;padding:14px;margin:10px 0;overflow:auto}
.name{font-size:19px;font-weight:bold}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.actions button{flex:1}
small{color:#667581}
#editor{display:none;background:white;border:1px solid #ccd5df;border-radius:13px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
#photoPreview{width:90px;height:90px;object-fit:cover;border-radius:50%;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>📇 Peters Adressbuch</h1>
  <small style="color:#d9e7f1">Deine Kontakte. Einfach. Privat.</small>
</header>

<main>
  <input id="search" placeholder="🔎 Kontakte suchen …" aria-label="Kontakte suchen">
  <div class="row">
    <button type="button" onclick="newContact()">＋ Kontakt</button>
    <button type="button" onclick="backup()">Backup speichern</button>
  </div>
  <div class="row">
    <button type="button" class="secondary" onclick="$('file').click()">Backup / VCF importieren</button>
    <input id="file" type="file" accept=".json,.vcf,.vcard" hidden onchange="importFile(event)">
  </div>

  <section id="editor">
    <h2 id="formTitle">Neuer Kontakt</h2>
    <input id="id" type="hidden">

    <label for="name">Name *</label>
    <input id="name" placeholder="Vor- und Nachname" autocomplete="name">

    <label for="photoFile">Kontaktfoto (aus der Galerie)</label>
    <input id="photoFile" type="file" accept="image/*">
    <img id="photoPreview" alt="Vorschau Kontaktfoto" hidden>
    <div><button type="button" class="secondary" onclick="removePhoto()">Foto entfernen</button></div>

    <label for="company">Firma</label>
    <input id="company" placeholder="Firma">

    <label for="phone">Telefon</label>
    <input id="phone" type="tel" placeholder="+49 …">

    <label for="email">E-Mail</label>
    <input id="email" type="email" placeholder="E-Mail-Adresse">

    <label for="street">Straße und Hausnummer</label>
    <input id="street" placeholder="Straße und Hausnummer">

    <div class="row">
      <input id="postcode" placeholder="PLZ" aria-label="Postleitzahl">
      <input id="city" placeholder="Ort" aria-label="Ort">
    </div>

    <label for="notes">Notizen</label>
    <textarea id="notes" rows="3" placeholder="Notizen"></textarea>

    <button type="button" onclick="saveContact()">Speichern</button>
    <button type="button" class="secondary" onclick="closeEditor()">Abbrechen</button>
  </section>

  <p id="count"><small>Kontakte werden lokal gespeichert.</small></p>
  <section id="contacts"></section>
  <p><small>Die Kontakte bleiben in diesem Browser auf deinem Gerät. Bitte regelmäßig ein Backup erstellen. Ein Backup enthält auch die gespeicherten Kontaktfotos.</small></p>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const fields = ["name","company","phone","email","street","postcode","city","notes"];
let contacts = [];
let currentPhoto = "";

try {
  const stored = JSON.parse(localStorage.getItem("petersKontakte") || "[]");
  contacts = Array.isArray(stored) ? stored : [];
} catch (error) {
  contacts = [];
}

function persist() {
  try {
    localStorage.setItem("petersKontakte", JSON.stringify(contacts));
  } catch (error) {
    alert("Speichern nicht möglich. Möglicherweise sind die Fotos zu groß. Bitte kleinere Fotos verwenden und ein Backup erstellen.");
  }
}

function esc(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[char]));
}

$("photoFile").addEventListener("change", function () {
  const file = this.files && this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Bitte eine Bilddatei auswählen.");
    this.value = "";
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    alert("Bitte ein Foto mit maximal 3 MB auswählen.");
    this.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = function () {
    currentPhoto = reader.result;
    $("photoPreview").src = currentPhoto;
    $("photoPreview").hidden = false;
  };
  reader.onerror = function () {
    alert("Das Foto konnte nicht geladen werden.");
  };
  reader.readAsDataURL(file);
});

function removePhoto() {
  currentPhoto = "";
  $("photoFile").value = "";
  $("photoPreview").removeAttribute("src");
  $("photoPreview").hidden = true;
}

function render() {
  const query = $("search").value.trim().toLocaleLowerCase("de");
  const list = contacts
    .filter(contact => fields.some(key =>
      String(contact[key] || "").toLocaleLowerCase("de").includes(query)
    ))
    .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "de"));

  $("count").textContent = list.length + (list.length === 1 ? " Kontakt" : " Kontakte");

  $("contacts").innerHTML = list.map(contact => {
    const address = [
      contact.street,
      [contact.postcode, contact.city].filter(Boolean).join(" ")
    ].filter(Boolean).join(", ");

    const photo = contact.photo
      ? `<img src="${contact.photo}" alt="Kontaktfoto" style="width:64px;height:64px;object-fit:cover;border-radius:50%;float:right;margin-left:10px">`
      : "";

    return `<article class="card">
      ${photo}
      <div class="name">${esc(contact.name)}</div>
      ${contact.company ? `<div>${esc(contact.company)}</div>` : ""}
      ${contact.phone ? `<p>☎ ${esc(contact.phone)}</p>` : ""}
      ${contact.email ? `<p>✉ <a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a></p>` : ""}
      ${address ? `<p>📍 ${esc(address)}</p>` : ""}
      ${contact.notes ? `<p>${esc(contact.notes).replace(/\n/g, "<br>")}</p>` : ""}
      <div class="actions">
        ${contact.phone ? `<button type="button" onclick="callContact('${esc(contact.id)}')">Anrufen</button>
        <button type="button" onclick="whatsapp('${esc(contact.id)}')">WhatsApp</button>` : ""}
        <button type="button" class="secondary" onclick="editContact('${esc(contact.id)}')">Bearbeiten</button>
        <button type="button" class="secondary" onclick="deleteContact('${esc(contact.id)}')">Löschen</button>
        ${address ? `<button type="button" class="secondary" onclick="maps('${esc(contact.id)}')">Karte</button>` : ""}
      </div>
    </article>`;
  }).join("") || "<div class='card'>Keine Kontakte gefunden. Lege deinen ersten Kontakt an.</div>";
}

function newContact() {
  $("formTitle").textContent = "Neuer Kontakt";
  $("id").value = "";
  fields.forEach(key => $(key).value = "");
  removePhoto();
  $("editor").style.display = "block";
  window.scrollTo({top: 0, behavior: "smooth"});
  $("name").focus();
}

function editContact(id) {
  const contact = contacts.find(item => String(item.id) === String(id));
  if (!contact) return;

  $("formTitle").textContent = "Kontakt bearbeiten";
  $("id").value = contact.id;
  fields.forEach(key => $(key).value = contact[key] || "");
  currentPhoto = contact.photo || "";
  $("photoFile").value = "";

  if (currentPhoto) {
    $("photoPreview").src = currentPhoto;
    $("photoPreview").hidden = false;
  } else {
    $("photoPreview").removeAttribute("src");
    $("photoPreview").hidden = true;
  }

  $("editor").style.display = "block";
  window.scrollTo({top: 0, behavior: "smooth"});
}

function closeEditor() {
  $("editor").style.display = "none";
}

function saveContact() {
  const contact = {id: $("id").value || String(Date.now())};
  fields.forEach(key => contact[key] = $(key).value.trim());
  contact.photo = currentPhoto;

  if (!contact.name) {
    alert("Bitte einen Namen eingeben.");
    $("name").focus();
    return;
  }

  const index = contacts.findIndex(item => String(item.id) === String(contact.id));
  if (index >= 0) contacts[index] = contact;
  else contacts.push(contact);

  persist();
  closeEditor();
  render();
}

function deleteContact(id) {
  const contact = contacts.find(item => String(item.id) === String(id));
  if (contact && confirm("Kontakt " + contact.name + " wirklich löschen?")) {
    contacts = contacts.filter(item => String(item.id) !== String(id));
    persist();
    render();
  }
}

function callContact(id) {
  const contact = contacts.find(item => String(item.id) === String(id));
  if (!contact || !contact.phone) return;
  if (confirm("Telefonwähler für " + contact.name + " (" + contact.phone + ") öffnen?")) {
    window.location.href = "tel:" + contact.phone;
  }
}

function whatsapp(id) {
  const contact = contacts.find(item => String(item.id) === String(id));
  if (!contact || !contact.phone) return;
  if (!confirm("WhatsApp für " + contact.name + " öffnen?")) return;

  let number = contact.phone.replace(/[^\d+]/g, "");
  if (number.startsWith("+")) number = number.slice(1);
  else if (number.startsWith("00")) number = number.slice(2);
  else if (number.startsWith("0")) {
    alert("Bitte die Nummer international speichern, z. B. +49 statt 0 am Anfang.");
    return;
  }

  number = number.replace(/\D/g, "");
  if (number) window.open("https://wa.me/" + number, "_blank", "noopener");
}

function maps(id) {
  const contact = contacts.find(item => String(item.id) === String(id));
  if (!contact) return;
  const address = [contact.street, contact.postcode, contact.city].filter(Boolean).join(", ");
  if (address) window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address), "_blank", "noopener");
}

function backup() {
  const blob = new Blob(
    [JSON.stringify({format: "PetersAdressbuch", contacts: contacts}, null, 2)],
    {type: "application/json"}
  );
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "peters-adressbuch-backup.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    let incoming = [];

    if (/\.json$/i.test(file.name)) {
      const data = JSON.parse(text);
      incoming = Array.isArray(data) ? data : data.contacts;
      if (!Array.isArray(incoming)) throw new Error("Ungültige Backup-Datei");
    } else if (/\.vcf$|\.vcard$/i.test(file.name) || text.includes("BEGIN:VCARD")) {
      const unfolded = text.replace(/\r?\n[ \t]/g, "");
      incoming = unfolded.split(/BEGIN:VCARD/i).slice(1).map(block => {
        const contact = {};
        block.split(/END:VCARD/i)[0].split(/\r?\n/).forEach(line => {
          const index = line.indexOf(":");
          if (index < 0) return;
          const key = line.slice(0, index).split(";")[0].toUpperCase();
          const value = line.slice(index + 1).replace(/\\n/gi, " ").replace(/\\,/g, ",");
          if (key === "FN") contact.name = value;
          if (key === "ORG") contact.company = value;
          if (key === "TEL" && !contact.phone) contact.phone = value;
          if (key === "EMAIL" && !contact.email) contact.email = value;
          if (key === "NOTE") contact.notes = value;
          if (key === "ADR") {
            const parts = value.split(";");
            contact.street = parts[2] || "";
            contact.city = parts[3] || "";
            contact.postcode = parts[5] || "";
          }
        });
        contact.id = String(Date.now() + Math.random());
        return contact;
      });
    } else {
      throw new Error("Bitte ein JSON-Backup oder eine VCF-Datei auswählen.");
    }

    if (!confirm(incoming.length + " Kontakte gefunden. Importieren?")) return;

    const known = new Set(contacts.map(contact =>
      (contact.phone || "").replace(/\D/g, "")
    ).filter(Boolean));

    let added = 0;
    incoming.forEach(raw => {
      const contact = {id: String(Date.now() + Math.random()), photo: raw.photo || ""};
      fields.forEach(key => contact[key] = String(raw[key] || ""));
      const phone = contact.phone.replace(/\D/g, "");
      if (phone && known.has(phone)) return;
      if (!contact.name) contact.name = "Importierter Kontakt";
      contacts.push(contact);
      if (phone) known.add(phone);
      added++;
    });

    persist();
    render();
    alert(added + " Kontakte importiert.");
  } catch (error) {
    alert("Import fehlgeschlagen: " + error.message);
  } finally {
    event.target.value = "";
  }
}

$("search").addEventListener("input", render);
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.error("Offline-Modus:", error));
  });
}
</script>
</body>
</html>
